services:
  demo:
    build:
      context: .
      target: demo
    init: true
    ports:
      - "${DEMO_BIND:-0.0.0.0}:${DEMO_PORT:-8098}:8098"
  verify:
    build:
      context: .
      target: verify
    profiles: [test]
    init: true
    shm_size: 256mb
    user: "${DEMO_UID:-1000}:${DEMO_GID:-1000}"
    volumes:
      - ./evidence:/app/evidence
