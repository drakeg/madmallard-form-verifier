services:
  demo:
    build: .
    init: true
    ports:
      - "${DEMO_BIND:-0.0.0.0}:${DEMO_PORT:-8098}:8098"
  verify:
    build: .
    profiles: [test]
    init: true
    shm_size: 256mb
    user: "${DEMO_UID:-1000}:${DEMO_GID:-1000}"
    command: ["node", "verify.mjs"]
    volumes:
      - ./evidence:/app/evidence
