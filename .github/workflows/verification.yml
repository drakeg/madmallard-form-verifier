name: Browser verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify the published demo
        run: |
          docker compose up --build -d demo
          curl --fail --silent --show-error --retry 10 --retry-connrefused --max-time 5 \
            http://127.0.0.1:8098/ | grep -F '<h1>Quote form demo</h1>'
      - run: mkdir -p evidence
      - run: DEMO_UID=$(id -u) DEMO_GID=$(id -g) docker compose run --build --rm verify
      - uses: actions/upload-artifact@v7
        with:
          name: synthetic-delivery-evidence
          path: evidence/
